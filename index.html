<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Near Miss Report 工地險兆快報</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        #map { height: 320px; width: 100%; margin-top: 8px; border-radius: 6px; border: 1px solid #ccc; }
        
        .submit-btn { background-color: #007bff; color: white; border: none; padding: 12px 24px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; width: 100%; }
        .submit-btn:hover { background-color: #0056b3; }
        .submit-btn:disabled { background-color: #6c757d; cursor: not-allowed; }

        .whatsapp-btn { background-color: #25D366; color: white; border: none; padding: 12px 24px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 15px; display: none; text-align: center; text-decoration: none; box-sizing: border-box; }
        .whatsapp-btn:hover { background-color: #128C7E; }
        
        .hint { font-size: 0.85em; color: #666; font-weight: normal; }
        .subtitle { color: #555; margin-top: -10px; margin-bottom: 25px; }

        .preview-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .preview-item { position: relative; width: 100px; height: 100px; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        .remove-btn { position: absolute; top: -5px; right: -5px; background: #dc3545; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; line-height: 18px; text-align: center; }

        .success-message { display: none; padding: 15px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 4px; margin-top: 15px; font-weight: bold; text-align: center; }
    </style>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("VEcVRiOEO0K0WqmxT");
        })();
    </script>
</head>
<body>

    <h2>⚠️ Near Miss Report 工地險兆快報</h2>
    <p class="subtitle">請協助填寫您發現的潛在危險或工地險兆事件。<br><span style="font-size: 0.9em; color: #666;">Please report any near miss or potential hazards identified on site.</span></p>

    <form id="nearMissForm">
        <div class="form-group">
            <label for="incident_datetime">發生日期 / 時間<br><span class="hint">Date and Time of Occurrence</span></label>
            <input type="datetime-local" id="incident_datetime" name="incident_datetime" required>
        </div>

        <div class="form-group">
            <label>在地圖上標示位置<br><span class="hint">Pinpoint Location on Map (Please click on the map to select location)</span></label>
            <div id="map"></div>
        </div>

        <input type="hidden" id="latitude" name="latitude">
        <input type="hidden" id="longitude" name="longitude">
        
        <div class="form-group">
            <label for="coordinates_display">已選擇的經緯度<br><span class="hint">Selected Coordinates</span></label>
            <input type="text" id="coordinates_display" name="coordinates_display" readonly placeholder="尚未在地圖點選位置 / Location not selected yet" style="background-color: #f8f9fa;">
        </div>

        <div class="form-group">
            <label for="location_name">具體位置說明<br><span class="hint">Specific Location Details</span></label>
            <input type="text" id="location_name" name="location_name" placeholder="例如：享和街 後巷 近燈柱GC1005 / e.g. Heung Wo Street back alley, near lamp post GC1005" required>
        </div>

        <div class="form-group">
            <label for="category">事件類型<br><span class="hint">Incident Category</span></label>
            <select id="category" name="category" required>
                <option value="">請選擇 / Please Select</option>
                <option value="跌倒/絆倒 Slip/Trip/Fall">跌倒 / 絆倒風險 (Slip / Trip / Fall Hazard)</option>
                <option value="設備故障 Equipment Fault">設備 / 工具故障 (Equipment / Tool Fault)</option>
                <option value="物體掉落 Falling Object">物體掉落風險 (Falling Object Hazard)</option>
                <option value="電氣安全 Electrical/Fire">電氣 / 火災隱患 (Electrical / Fire Hazard)</option>
                <option value="高處作業 Working at Height">高處作業安全 (Working at Height)</option>
                <option value="其他 Others">其他 (Others)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">事件詳細描述<br><span class="hint">Incident Description</span></label>
            <textarea id="description" name="description" rows="4" placeholder="請詳細說明當時情況及潛在危害... / Please describe the situation and potential hazards in detail..." required></textarea>
        </div>

        <div class="form-group">
            <label for="photo">現場照片上傳（可選多張）<br><span class="hint">Upload Photos (Optional, multiple allowed)</span></label>
            <input type="file" id="photo" name="photo" accept="image/*" multiple>
            
            <div id="previewList" class="preview-list"></div>
        </div>

        <div class="form-group">
            <label for="reporter">回報人姓名 / 聯絡方式（選填，可匿名）<br><span class="hint">Reporter Name / Contact Info (Optional, can be anonymous)</span></label>
            <input type="text" id="reporter" name="reporter" placeholder="留空代表匿名回報 / Leave blank for anonymous report">
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">📩 提交 Email 回報 / Submit Report</button>

        <div id="successMessage" class="success-message">
            ✅ Email 回報已成功送出！<br>
            <span style="font-size:0.9em; font-weight:normal;">Email report sent successfully! You can now forward it via WhatsApp below.</span>
        </div>

        <button type="button" id="whatsappBtn" class="whatsapp-btn">💬 點擊此處透過 WhatsApp 轉發此 Report</button>
    </form>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const defaultLat = 22.3193;
        const defaultLng = 114.1694;
        const map = L.map('map').setView([defaultLat, defaultLng], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let marker;

        function updatePosition(lat, lng) {
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng], { draggable: true }).addTo(map);
                marker.on('dragend', function (e) {
                    const position = marker.getLatLng();
                    updatePosition(position.lat, position.lng);
                });
            }

            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lng.toFixed(6);
            document.getElementById('coordinates_display').value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        }

        map.on('click', function(e) {
            updatePosition(e.latlng.lat, e.latlng.lng);
        });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                map.setView([userLat, userLng], 16);
                updatePosition(userLat, userLng);
            });
        }

        const photoInput = document.getElementById('photo');
        const previewList = document.getElementById('previewList');
        let rawFilesArray = [];

        photoInput.addEventListener('change', function(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                rawFilesArray.push(file);
            });
            renderPreviews();
            photoInput.value = '';
        });

        function renderPreviews() {
            previewList.innerHTML = '';
            rawFilesArray.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                const objectUrl = URL.createObjectURL(file);
                item.innerHTML = `
                    <img src="${objectUrl}" />
                    <button type="button" class="remove-btn" onclick="removePhoto(${index})">✕</button>
                `;
                previewList.appendChild(item);
            });
        }

        window.removePhoto = function(index) {
            rawFilesArray.splice(index, 1);
            renderPreviews();
        }

        // 💡 步驟 1：用 Canvas 適度優化尺寸（1200px 寬度保持高度清晰）
        function processImageToCanvas(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 1200;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 轉出高質素 Base64 準備上傳至圖床
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                        resolve(dataUrl);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 💡 步驟 2：將 Base64 圖片上傳至圖床 API 取得相片 Link
        async function uploadImageToLink(base64Data) {
            // 清除 Base64 標頭
            const base64Image = base64Data.replace(/^data:image\/(png|jpeg|jpg);base64,/, '');
            
            const formData = new FormData();
            formData.append('image', base64Image);

            // 使用 免費 Imgbb API (已預置免申請金鑰)
            const response = await fetch('https://api.imgbb.com/1/upload?key=c2d3345448be6b7b20e0d69116a8a3a0', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (result.success) {
                return result.data.url; // 回傳圖片的 Link 網址
            } else {
                throw new Error('Image upload failed');
            }
        }

        const datetimeInput = document.getElementById('incident_datetime');
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        datetimeInput.value = now.toISOString().slice(0, 16);

        const form = document.getElementById('nearMissForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const whatsappBtn = document.getElementById('whatsappBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;

            if (!lat || !lng) {
                alert("⚠️ 請在地圖上點選或標示發生位置！\nPlease click on the map to select the location!");
                document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ 正在生成圖片網址與傳送 Email...";

            let photosHtml = '';

            try {
                if (rawFilesArray.length > 0) {
                    const imageUrls = [];
                    for (let file of rawFilesArray) {
                        // 1. Canvas 調整畫質尺寸 -> 2. 上傳轉為 Link
                        const canvasBase64 = await processImageToCanvas(file);
                        const imgUrl = await uploadImageToLink(canvasBase64);
                        imageUrls.push(imgUrl);
                    }

                    // 產生 Email 顯示圖片及超連結的 HTML
                    photosHtml = imageUrls.map(url => `
                        <div style="margin-bottom: 12px;">
                            <img src="${url}" style="max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid #ddd; display: block; margin-bottom: 4px;" />
                            <a href="${url}" target="_blank" style="font-size: 12px; color: #007bff; text-decoration: underline;">🔍 點擊開啓高清大圖 Link</a>
                        </div>
                    `).join('');
                }

                const sendTime = new Date().toLocaleString('zh-HK', { hour12: false });

                const templateParams = {
                    send_time: sendTime,
                    datetime: document.getElementById('incident_datetime').value.replace('T', ' '),
                    coords: document.getElementById('coordinates_display').value,
                    location: document.getElementById('location_name').value,
                    category: document.getElementById('category').value,
                    description: document.getElementById('description').value,
                    reporter: document.getElementById('reporter').value || '匿名 / Anonymous',
                    photos_html: photosHtml // 這裏傳送的是包含 Link 的極小 HTML
                };

                await emailjs.send('service_dc202304', 'template_c35i3of', templateParams);

                submitBtn.innerText = "✅ Email 已成功提交 / Email Submitted";
                successMessage.style.display = 'block';
                whatsappBtn.style.display = 'block';
                whatsappBtn.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                alert("❌ 傳送失敗: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "📩 提交 Email 回報 / Submit Report";
            }
        });

        // WhatsApp 轉發邏輯
        whatsappBtn.addEventListener('click', function() {
            if (rawFilesArray.length > 0) {
                alert("⚠️ 溫馨提示 / Notice：\n\n網頁文字已自動帶入 WhatsApp，但「現場照片」受系統限制無法自動夾帶。\n\n請在跳轉至 WhatsApp 後，手動點擊附件（📎）或相機按鈕重新上傳相片！");
            }

            const datetime = document.getElementById('incident_datetime').value.replace('T', ' ') || '未提供 / Not provided';
            const coords = document.getElementById('coordinates_display').value;
            const location = document.getElementById('location_name').value || '無 / None';
            const category = document.getElementById('category').value || '未選擇 / Not selected';
            const description = document.getElementById('description').value || '無 / None';
            const reporter = document.getElementById('reporter').value || '匿名 / Anonymous';

            let message = `⚠️ *Near Miss Report 工地險兆快報*\n\n`;
            message += `📅 *發生時間/Date & Time:* ${datetime}\n`;
            message += `📍 *經緯度/Coordinates:* ${coords}\n`;
            message += `🏢 *具體位置/Location:* ${location}\n`;
            message += `🏷️ *事件類型/Category:* ${category}\n`;
            message += `📝 *事件描述/Description:* ${description}\n`;
            message += `👤 *回報人/Reporter:* ${reporter}\n\n`;
            message += `🗺️ *地圖連結:* https://www.google.com/maps?q=${coords.replace(/\s+/g, '')}\n`;

            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>
